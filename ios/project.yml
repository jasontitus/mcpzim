# XcodeGen spec. Run `xcodegen generate` (or `brew install xcodegen` first)
# to produce MCPZimChat.xcodeproj. Keeping the declarative spec in git means
# the Xcode project itself is regeneratable and diff-friendly.

name: MCPZimChat
options:
  bundleIdPrefix: org.mcpzim
  deploymentTarget:
    iOS: 18.0
    macOS: 15.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""          # fill in your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MCPZimKit:
    path: ../swift
  # Vendored fork of https://github.com/ml-explore/mlx-swift-lm (pin 3.31.3).
  # Local patch inserts a `QuantizedKVCacheProtocol` branch into
  # `Libraries/MLXLLM/Models/Gemma4Text.swift::Gemma4Attention.callAsFunction`
  # so MLX's 4-bit groupwise `QuantizedKVCache` runs end-to-end —
  # upstream calls `cache.update(...)` unconditionally and MLX's
  # quantized cache rejects that with a runtime assertion. The patch
  # also dequantizes the full-history K/V on the way out so
  # downstream KV-shared layers (Gemma 4's layers 15..34 donating
  # from 0..14) still see full history. See `KV_CACHE_COMPRESSION.md`
  # Option 1 for the rationale and upstream-PR plan.
  mlx-swift-lm:
    path: LocalPackages/mlx-swift-lm
  # `#huggingFaceLoadModelContainer` / `#hubDownloader` /
  # `#huggingFaceTokenizerLoader` macros live here. Expansions
  # reference `HuggingFace.HubClient` (from swift-huggingface) and
  # `Tokenizers.AutoTokenizer` (from swift-transformers), so those
  # two deps have to be resolvable from the app module too.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.16.0
  # High-quality on-device TTS (Kokoro v1.0 via MLX). Vendored as a
  # local path because upstream kokoro-ios pins `mlx-swift` to exact
  # 0.30.2 which conflicts with Swift-gemma4-core's 0.31+ requirement.
  # We keep a patched Package.swift under LocalPackages/kokoro-ios
  # that relaxes the constraint (same fix CastCircle applied in its
  # vendored copy). The first launch after install can fetch the
  # model (~312 MB bf16 safetensors) + voices pack into Application
  # Support/models/kokoro_mlx/. Without the download, voice chat
  # falls back to AVSpeechSynthesizer.
  KokoroSwift:
    path: LocalPackages/kokoro-ios
  # Core ML/ANE TTS backends. Supertonic 3 INT8 is linked into both apps and
  # selected explicitly as the fixed-shape ANE-bucketed variant; the isolated
  # Mac benchmark remains available for repeatable comparisons with Kokoro.
  FluidAudio:
    # Vendored from 0.15.5. MCPZim carries a measured 96-character Supertonic
    # chunk limit; see LocalPackages/FluidAudio/MCPZIM_PATCHES.md.
    path: LocalPackages/FluidAudio
  # MLXUtilsLibrary exposes `NpyzReader` which we use directly to
  # decode the Kokoro voices.npz archive. KokoroSwift is built as a
  # dynamic library so transitive symbols aren't visible to us;
  # declaring this as a direct package dep pulls the static lib into
  # our link set so `NpyzReader.read(...)` resolves.
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    from: 0.0.6
  # Wrapper SPM package over the upstream llama.cpp XCFramework
  # (pinned Prism `prism-b9591` today — bump by replacing the framework
  # on disk; see LocalPackages/llama.cpp-swift/Package.swift header).
  # Exposes the `llama` C module so LlamaCppProvider.swift can hit
  # the full `llama_context_params` surface (swa_full, type_k/v,
  # flash_attn_type) that no maintained Swift wrapper currently
  # surfaces.
  LlamaCppSwift:
    path: LocalPackages/llama.cpp-swift
targets:
  MCPZimChat:
    type: application
    platform: iOS
    scheme:
      testTargets: []
      gatherCoverageData: false
    sources:
      - path: MCPZimChat
        excludes:
          - "**/.DS_Store"
          - "Info-Mac.plist"
          - "GoogleService-Info-Mac.plist"
          - "Frameworks/**"
    info:
      path: MCPZimChat/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: Zimfo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIM Offline Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.openzim.zim
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openzim.zim
            UTTypeDescription: ZIM Offline Archive
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - zim
              public.mime-type:
                - application/x-zim
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        NSDocumentsFolderUsageDescription: "Needed to read ZIM archives you drop into the app's Documents folder."
        NSLocationWhenInUseUsageDescription: "Zimfo uses your location for routing and \"what's nearby\" queries. All lookups stay on-device."
        NSMicrophoneUsageDescription: "Zimfo uses the microphone for hands-free voice chat with the on-device model. Audio is transcribed locally and never leaves the device."
        NSSpeechRecognitionUsageDescription: "Zimfo transcribes your voice on-device using Apple's speech recognizer. Nothing is sent to Apple or any server."
    dependencies:
      - package: MCPZimKit
        product: MCPZimKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-huggingface
        product: HuggingFace
      - package: KokoroSwift
        product: KokoroSwift
        embed: true
        codeSign: true
      - package: FluidAudio
        product: FluidAudio
      - package: MLXUtilsLibrary
        product: MLXUtilsLibrary
      - package: LlamaCppSwift
        product: LlamaCppSwift
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebasePerformance
      - package: Firebase
        product: FirebaseStorage
      - framework: MCPZimChat/Frameworks/CoreKiwix.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiltastech.zimfo
        DEVELOPMENT_TEAM: A6G8H8NGAM
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Zimfo"
        CODE_SIGN_ENTITLEMENTS: MCPZimChat/MCPZimChat-iOS.entitlements
        # LibzimBridge.h/mm is a no-op until CoreKiwix.xcframework is linked
        # (both files wrap their contents in `__has_include(<zim/archive.h>)`),
        # so keeping the bridging header wired up here is safe in either state.
        SWIFT_OBJC_BRIDGING_HEADER: MCPZimChat/Libzim/LibzimBridge.h
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_ENABLE_MODULES: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      - name: Upload Crashlytics Symbols
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            "${MCPZIM_PACKAGE_CACHE_DIR:-${BUILD_DIR%/Build/*}/SourcePackages}/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"

  MCPZimChatMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MCPZimChatMacTests
    dependencies:
      - target: MCPZimChatMac
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MCPZimChatMac.app/Contents/MacOS/MCPZimChatMac"
        PRODUCT_BUNDLE_IDENTIFIER: org.mcpzim.MCPZimChatMacTests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_TESTABILITY: "YES"
        # Matches the app target: CoreKiwix has C++ headers so the test
        # module scanner needs libc++ too.
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
    scheme:
      testTargets:
        - MCPZimChatMacTests

  MCPZimEvalCLI:
    # Headless command-line eval harness. Ships as a plain
    # macOS executable so the multi-model scorecard test can run
    # in its own process — previously it was an XCTest bundle
    # injected into MCPZimChatMac.app, which forced the app's own
    # `@main` ChatSession to stand up in parallel with the test's
    # ChatSession and caused MLX to crash in slice_update when
    # the two sessions raced on the GPU.
    type: tool
    platform: macOS
    sources:
      - path: MCPZimChat
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "GoogleService-Info.plist"
          - "GoogleService-Info-Mac.plist"
          - "Info-Mac.plist"
          - "App/**"    # no SwiftUI @main; we supply our own main.swift
          - "Views/**"  # no UI in a CLI
          - "Voice/**"  # no AVFoundation / Kokoro pulls
      - path: MCPZimEval
    dependencies:
      - package: MCPZimKit
        product: MCPZimKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-huggingface
        product: HuggingFace
      - package: LlamaCppSwift
        product: LlamaCppSwift
      - framework: MCPZimChat/Frameworks/CoreKiwix.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mcpzim.MCPZimEvalCLI
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_OBJC_BRIDGING_HEADER: MCPZimChat/Libzim/LibzimBridge.h
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MCPZIM_EVAL"
        CLANG_ENABLE_MODULES: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
    scheme:
      testTargets: []
      gatherCoverageData: false

  MCPZimTTSBenchCLI:
    # Minimal cold-process TTS harness. Keeping the chat/LLM packages out of
    # this executable avoids contaminating latency/RSS measurements and avoids
    # loading a second MLXNN product beside Kokoro's dynamic framework.
    type: tool
    platform: macOS
    sources:
      - path: MCPZimChat/Voice/TTSService.swift
      - path: MCPZimChat/Voice/KokoroAssets.swift
      - path: MCPZimTTSBench
    dependencies:
      - package: KokoroSwift
        product: KokoroSwift
      - package: MLXUtilsLibrary
        product: MLXUtilsLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mcpzim.MCPZimTTSBenchCLI
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    scheme:
      testTargets: []
      gatherCoverageData: false

  MCPZimCoreMLTTSBenchCLI:
    # Core ML/ANE comparison process. Keeping FluidAudio out of the MLX
    # benchmark means neither engine's linked runtime contaminates the
    # other's startup or resident-memory measurements.
    type: tool
    platform: macOS
    sources:
      - path: MCPZimCoreMLTTSBench
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mcpzim.MCPZimCoreMLTTSBenchCLI
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    scheme:
      testTargets: []
      gatherCoverageData: false

  MCPZimChatMac:
    type: application
    platform: macOS
    sources:
      - path: MCPZimChat
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "GoogleService-Info.plist"
    info:
      path: MCPZimChat/Info-Mac.plist
      properties:
        CFBundleDisplayName: Zimfo
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIM Offline Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.openzim.zim
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openzim.zim
            UTTypeDescription: ZIM Offline Archive
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - zim
              public.mime-type:
                - application/x-zim
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026"
        NSLocationUsageDescription: "Zimfo uses your location for routing and \"what's nearby\" queries. All lookups stay on-device."
        NSLocationWhenInUseUsageDescription: "Zimfo uses your location for routing and \"what's nearby\" queries. All lookups stay on-device."
        NSMicrophoneUsageDescription: "Zimfo uses the microphone for hands-free voice chat with the on-device model. Audio is transcribed locally and never leaves the device."
        NSSpeechRecognitionUsageDescription: "Zimfo transcribes your voice on-device using Apple's speech recognizer. Nothing is sent to Apple or any server."
        NSApplicationCrashOnExceptions: true
    dependencies:
      - package: MCPZimKit
        product: MCPZimKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-huggingface
        product: HuggingFace
      - package: KokoroSwift
        product: KokoroSwift
        embed: true
        codeSign: true
      - package: FluidAudio
        product: FluidAudio
      - package: MLXUtilsLibrary
        product: MLXUtilsLibrary
      - package: LlamaCppSwift
        product: LlamaCppSwift
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - framework: MCPZimChat/Frameworks/CoreKiwix.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mcpzim.MCPZimChatMac
        # Keep local macOS builds tied to a stable designated requirement so
        # TCC microphone/speech grants survive rebuilds.
        DEVELOPMENT_TEAM: A6G8H8NGAM
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_OBJC_BRIDGING_HEADER: MCPZimChat/Libzim/LibzimBridge.h
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_ENABLE_MODULES: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        CODE_SIGN_ENTITLEMENTS: MCPZimChat/MCPZimChat.entitlements
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      - name: Upload Crashlytics Symbols
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            "${MCPZIM_PACKAGE_CACHE_DIR:-${BUILD_DIR%/Build/*}/SourcePackages}/checkouts/firebase-ios-sdk/Crashlytics/run" -gsp "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info-Mac.plist"
          fi
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info-Mac.plist"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
    scheme:
      testTargets: []
      gatherCoverageData: false
